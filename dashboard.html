<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 21px;
        }

        .logout {
            background: white;
            color: #2563eb;
            border: none;
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
        }

        .container {
            width: 92%;
            max-width: 1000px;
            margin: 25px auto;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .welcome h2 {
            margin-bottom: 8px;
        }

        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .quiz-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .quiz-card h3 {
            margin-bottom: 10px;
        }

        .quiz-card p {
            color: #666;
            margin-bottom: 18px;
        }

        .start-btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 7px;
        }

        .empty {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <header>

        <h1>Student Dashboard</h1>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </header>

    <main class="container">

        <section class="welcome">

            <h2>Welcome, Student 👋</h2>

            <p>
                Choose an available quiz below to begin.
            </p>

        </section>

        <section>

            <h2 style="margin-bottom: 15px;">
                Available Quizzes
            </h2>

            <div class="quiz-grid">

                <div class="quiz-card">

                    <h3>Mathematics Quiz</h3>

                    <p>
                        20 questions • 20 minutes
                    </p>

                    <a href="quiz.html" class="start-btn">
                        Start Quiz
                    </a>

                </div>

                <div class="quiz-card">

                    <h3>Chemistry Quiz</h3>

                    <p>
                        20 questions • 20 minutes
                    </p>

                    <a href="quiz.html" class="start-btn">
                        Start Quiz
                    </a>

                </div>

                <div class="quiz-card">

                    <h3>Biology Quiz</h3>

                    <p>
                        20 questions • 20 minutes
                    </p>

                    <a href="quiz.html" class="start-btn">
                        Start Quiz
                    </a>

                </div>

            </div>

        </section>

    </main>

    <script>
        function logout() {
            window.location.href = "login.html";
        }
    </script>

</body>
</html>
