<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        header h1 {
            font-size: 20px;
        }

        .timer {
            background: white;
            color: #2563eb;
            padding: 8px 12px;
            border-radius: 7px;
            font-weight: bold;
        }

        .container {
            width: 94%;
            max-width: 800px;
            margin: 25px auto;
        }

        .progress {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .question-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .question-number {
            color: #2563eb;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .question {
            font-size: 19px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .option {
            display: block;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .option:hover {
            background: #f0f5ff;
        }

        .option input {
            margin-right: 10px;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            gap: 10px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .previous {
            background: #ddd;
        }

        .next {
            background: #2563eb;
            color: white;
        }

        .submit {
            background: #16a34a;
            color: white;
        }

        .message {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }
    </style>
</head>

<body>

<header>

    <h1 id="quizTitle">Loading quiz...</h1>

    <div class="timer" id="timer">
        --:--
    </div>

</header>

<main class="container">

    <div class="progress">
        Question <span id="current">-</span>
        of <span id="total">-</span>
    </div>

    <div class="question-box">

        <div class="question-number">
            Question <span id="number">-</span>
        </div>

        <div class="question" id="question">
            Loading question...
        </div>

        <div id="options"></div>

        <div class="buttons">

            <button
                class="previous"
                id="previousBtn">
                Previous
            </button>

            <button
                class="next"
                id="nextBtn">
                Next
            </button>

            <button
                class="submit"
                id="submitBtn"
                style="display:none;">
                Submit
            </button>

        </div>

    </div>

</main>


<script type="module">

import { db } from "./firebase.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


// ======================================
// GET QUIZ ID
// ======================================

const urlParams =
    new URLSearchParams(window.location.search);

const quizId =
    urlParams.get("id");


// ======================================
// PAGE ELEMENTS
// ======================================

const quizTitle =
    document.getElementById("quizTitle");

const timerElement =
    document.getElementById("timer");

const currentElement =
    document.getElementById("current");

const totalElement =
    document.getElementById("total");

const numberElement =
    document.getElementById("number");

const questionElement =
    document.getElementById("question");

const optionsElement =
    document.getElementById("options");

const previousBtn =
    document.getElementById("previousBtn");

const nextBtn =
    document.getElementById("nextBtn");

const submitBtn =
    document.getElementById("submitBtn");


// ======================================
// QUIZ VARIABLES
// ======================================

let quiz = null;

let questions = [];

let currentQuestion = 0;

let userAnswers = [];

let time = 0;

let timer;


// ======================================
// LOAD QUIZ
// ======================================

async function loadQuiz() {

    if (!quizId) {

        showMessage(
            "Quiz not found",
            "No quiz ID was provided."
        );

        return;
    }

    try {

        const quizReference =
            doc(
                db,
                "quizzes",
                quizId
            );

        const quizSnapshot =
            await getDoc(
                quizReference
            );


        if (!quizSnapshot.exists()) {

            showMessage(
                "Quiz not found",
                "This quiz does not exist."
            );

            return;
        }


        quiz =
            quizSnapshot.data();


        // Quiz title

        quizTitle.textContent =
            quiz.title || "Quiz";


        // ==================================
        // GET QUESTIONS
        // ==================================

        questions =
            Array.isArray(quiz.questions)
            ? quiz.questions
            : [];


        if (questions.length === 0) {

            showMessage(
                "Quiz not ready",
                "This quiz does not have any questions yet."
            );

            return;
        }


        // ==================================
        // START TIMER
        // ==================================

        totalElement.textContent =
            questions.length;


        const duration =
            Number(quiz.duration) || 20;


        time =
            duration * 60;


        startTimer();


        // ==================================
        // SHOW FIRST QUESTION
        // ==================================

        loadQuestion();

    }

    catch (error) {

        console.error(
            "Error loading quiz:",
            error
        );


        showMessage(
            "Unable to load quiz",
            "Please try again later."
        );

    }

}


// ======================================
// DISPLAY MESSAGE
// ======================================

function showMessage(
    title,
    message
) {

    document.querySelector(
        ".question-box"
    ).innerHTML = `

        <div class="message">

            <h2>${title}</h2>

            <p style="margin-top:10px;">
                ${message}
            </p>

        </div>

    `;

}


// ======================================
// LOAD CURRENT QUESTION
// ======================================

function loadQuestion() {

    const q =
        questions[currentQuestion];


    currentElement.textContent =
        currentQuestion + 1;


    numberElement.textContent =
        currentQuestion + 1;


    // ==================================
    // QUESTION TEXT
    // ==================================

    questionElement.textContent =
        q.question || "Question";


    // ==================================
    // OPTIONS
    // ==================================

    optionsElement.innerHTML = "";


    const options = [

        q.optionA,

        q.optionB,

        q.optionC,

        q.optionD

    ];


    options.forEach(
        (option, index) => {

            const label =
                document.createElement(
                    "label"
                );


            label.className =
                "option";


            label.innerHTML = `

                <input
                    type="radio"
                    name="answer"
                    value="${index}"
                    ${
                        userAnswers[
                            currentQuestion
                        ] === index
                        ? "checked"
                        : ""
                    }
                >

                ${String.fromCharCode(
                    65 + index
                )}.
                ${option || ""}

            `;


            optionsElement.appendChild(
                label
            );

        }
    );


    // ==================================
    // PREVIOUS BUTTON
    // ==================================

    previousBtn.disabled =
        currentQuestion === 0;


    // ==================================
    // NEXT / SUBMIT
    // ==================================

    if (
        currentQuestion ===
        questions.length - 1
    ) {

        nextBtn.style.display =
            "none";

        submitBtn.style.display =
            "block";

    }

    else {

        nextBtn.style.display =
            "block";

        submitBtn.style.display =
            "none";

    }

}


// ======================================
// SAVE ANSWER
// ======================================

function saveAnswer() {

    const selected =
        document.querySelector(
            'input[name="answer"]:checked'
        );


    if (selected) {

        userAnswers[
            currentQuestion
        ] =
            Number(
                selected.value
            );

    }

}


// ======================================
// NEXT
// ======================================

nextBtn.addEventListener(
    "click",
    function() {

        saveAnswer();


        if (
            currentQuestion <
            questions.length - 1
        ) {

            currentQuestion++;

            loadQuestion();

        }

    }
);


// ======================================
// PREVIOUS
// ======================================

previousBtn.addEventListener(
    "click",
    function() {

        saveAnswer();


        if (
            currentQuestion > 0
        ) {

            currentQuestion--;

            loadQuestion();

        }

    }
);


// ======================================
// SUBMIT
// ======================================

function submitQuiz() {

    saveAnswer();


    let score = 0;


    questions.forEach(
        (question, index) => {

            const correctAnswer =
                String(
                    question.answer || ""
                )
                .trim()
                .toUpperCase();


            const correctIndex =
                {
                    A: 0,
                    B: 1,
                    C: 2,
                    D: 3
                }[
                    correctAnswer
                ];


            if (
                userAnswers[index] ===
                correctIndex
            ) {

                score++;

            }

        }
    );


    localStorage.setItem(
        "quizScore",
        score
    );


    localStorage.setItem(
        "totalQuestions",
        questions.length
    );


    localStorage.setItem(
        "quizTitle",
        quiz.title || "Quiz"
    );


    window.location.href =
        "result.html";

}


submitBtn.addEventListener(
    "click",
    submitQuiz
);


// ======================================
// TIMER
// ======================================

function startTimer() {

    updateTimer();


    timer =
        setInterval(
            function() {

                time--;

                updateTimer();


                if (time <= 0) {

                    clearInterval(
                        timer
                    );

                    submitQuiz();

                }

            },
            1000
        );

}


function updateTimer() {

    const minutes =
        Math.floor(
            time / 60
        );


    const seconds =
        time % 60;


    timerElement.textContent =

        `${minutes}:${seconds
        .toString()
        .padStart(2, "0")}`;

}


// ======================================
// BASIC ANTI-CHEAT
// ======================================

let violations = 0;

const MAX_VIOLATIONS = 3;

let lastViolationTime = 0;


function recordViolation(reason) {

    const now =
        Date.now();


    if (
        now -
        lastViolationTime <
        2000
    ) {

        return;

    }


    lastViolationTime =
        now;


    violations++;


    alert(

        "⚠️ WARNING\n\n" +

        reason +

        "\n\nViolation " +

        violations +

        " of " +

        MAX_VIOLATIONS

    );


    if (
        violations >=
        MAX_VIOLATIONS
    ) {

        alert(
            "Quiz automatically submitted."
        );


        submitQuiz();

    }

}


// Tab switching

document.addEventListener(
    "visibilitychange",
    function() {

        if (document.hidden) {

            recordViolation(
                "You left the quiz page or switched to another tab."
            );

        }

    }
);


// Browser focus

window.addEventListener(
    "blur",
    function() {

        recordViolation(
            "The quiz window lost focus."
        );

    }
);


// Browser back button

history.pushState(
    null,
    "",
    location.href
);


window.addEventListener(
    "popstate",
    function() {

        history.pushState(
            null,
            "",
            location.href
        );


        recordViolation(
            "Attempt to leave the quiz was detected."
        );

    }
);


// Refresh / close warning

window.addEventListener(
    "beforeunload",
    function(event) {

        event.preventDefault();

        event.returnValue = "";

    }
);


// ======================================
// START
// ======================================

loadQuiz();

</script>

</body>
</html>
